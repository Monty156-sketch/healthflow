# HealthFlow API on Render (free tier).
# Render reads this file when the repo is connected as a Blueprint.
# Reference: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: healthflow-api
    runtime: node
    plan: free

    # Build from the repo root so pnpm can see the whole workspace
    # (apps/api depends on packages/db and packages/shared).
    # Only redeploy when something the API depends on changes.
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - render.yaml

    # Database changes are applied here, on every deploy, before the new API
    # starts, so a new version never runs against an old schema. Migrations
    # use Neon's direct connection (the pooled one cannot hold the lock
    # Prisma takes while migrating), so "-pooler" is removed for that step.
    # pnpm is run through npx so nothing is written to Render's read-only
    # system folders. NODE_ENV=development on the install step only, so
    # build tools in devDependencies (Prisma CLI, TypeScript) are installed.
    buildCommand: >-
      NODE_ENV=development npx --yes pnpm@10.28.0 install --frozen-lockfile &&
      npx --yes pnpm@10.28.0 --filter @healthflow/db generate &&
      DATABASE_URL="$(echo "$DATABASE_URL" | sed 's/-pooler//')" npx --yes pnpm@10.28.0 --filter @healthflow/db migrate:deploy &&
      npx --yes pnpm@10.28.0 --filter @healthflow/api build

    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # Neon pooled connection string.
      - key: DATABASE_URL
        sync: false

      # Random secrets generated by Render. Changing them only signs
      # everyone out; no data is lost.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_PEPPER
        generateValue: true

      # Must be the SAME value as in your local apps/api/.env, because local
      # and live share one Neon database. A different key here would make
      # every MFA secret saved so far unreadable.
      - key: MFA_ENCRYPTION_KEY
        sync: false

      # The frontend's URL, no trailing slash.
      - key: WEB_ORIGIN
        sync: false

      # Shared with the frontend so the API can trust the visitor IP it
      # forwards. Same value in Render and in Cloudflare.
      - key: PROXY_SHARED_SECRET
        sync: false

      # Email. Can stay empty until email sending is built.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # Text messages. Leave empty until one provider is set up; facilities
      # cannot turn texting on without it. Two providers work:
      #   Arkesel (default): SMS_API_KEY and SMS_SENDER_ID.
      #   SMS Gateway for Android (free software, your own phone and SIM):
      #   SMS_PROVIDER=sms-gate, SMS_GATE_USER and SMS_GATE_PASSWORD.
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        sync: false
      - key: SMS_PROVIDER
        sync: false
      - key: SMS_GATE_USER
        sync: false
      - key: SMS_GATE_PASSWORD
        sync: false
