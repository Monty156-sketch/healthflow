# HealthFlow API on Render (free tier).
# Render reads this file when the repo is connected as a Blueprint.
# Reference: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: healthflow-api
    runtime: node
    plan: free

    # Build from the repo root so pnpm can see the whole workspace
    # (apps/api depends on packages/db and packages/shared).
    # Only redeploy when something the API depends on changes.
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - render.yaml

    # pnpm is run through npx so nothing is written to Render's read-only
    # system folders. NODE_ENV=development on the install step only, so
    # build tools in devDependencies (Prisma CLI, TypeScript) are installed.
    buildCommand: >-
      NODE_ENV=development npx --yes pnpm@10.28.0 install --frozen-lockfile &&
      npx --yes pnpm@10.28.0 --filter @healthflow/db generate &&
      npx --yes pnpm@10.28.0 --filter @healthflow/api build

    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # Neon pooled connection string.
      - key: DATABASE_URL
        sync: false

      # Random secrets generated by Render. Changing them only signs
      # everyone out; no data is lost.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_PEPPER
        generateValue: true

      # Must be the SAME value as in your local apps/api/.env, because local
      # and live share one Neon database. A different key here would make
      # every MFA secret saved so far unreadable.
      - key: MFA_ENCRYPTION_KEY
        sync: false

      # The Cloudflare Pages URL, no trailing slash.
      - key: WEB_ORIGIN
        sync: false

      # Email. Can stay empty until email sending is built.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
