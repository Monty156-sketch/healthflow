name: CI

# Runs on every push and pull request. Render and Cloudflare redeploy on
# their own when main changes; this workflow is the check that the code
# works: lint, typecheck, and the API's integration tests against a real,
# throwaway Postgres database (never Neon).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: healthflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/healthflow_test"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Create the test database tables
        run: pnpm --filter @healthflow/db migrate:deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        shell: bash
        run: |
          set +e
          pnpm test 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          grep -E "AssertionError|Error:|FAIL" test.log | sed 's/\x1b\[[0-9;]*m//g' | head -25 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          exit $code
