name: CI

# Runs on every push and pull request. Render and Cloudflare redeploy on
# their own when main changes; this workflow is the check that the code
# works: lint, typecheck, and the API's integration tests against a real,
# throwaway Postgres database (never Neon).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: healthflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/healthflow_test"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Create the test database tables
        run: pnpm --filter @healthflow/db migrate:deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee /tmp/test.log || { grep -E "FAIL|Error|×|expected|Expected|Received|❯ test" /tmp/test.log | head -60 | sed 's/^/::error::/'; exit 1; }

  # The same API tests again with row-level security switched on. The app connects as a restricted
  # role that owns nothing, so the database policies apply to it; set-up and assertions use the owner.
  # Requests still get their real scope (the facility, or system for sign-in and the console); only
  # tests that call library code directly, outside a request, run unscoped.
  rls-enforced-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: healthflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/healthflow_test"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Create the tables (as the owner)
        run: pnpm --filter @healthflow/db migrate:deploy
      - name: Create the restricted role the app will use
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d healthflow_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE hf_app LOGIN PASSWORD 'hf_app' NOSUPERUSER NOBYPASSRLS;
          GRANT USAGE ON SCHEMA public TO hf_app;
          GRANT SELECT, INSERT, UPDATE, DELETE, TRUNCATE ON ALL TABLES IN SCHEMA public TO hf_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO hf_app;
          SQL
      - name: Test with row-level security on
        shell: bash
        env:
          DATABASE_URL: "postgresql://hf_app:hf_app@localhost:5432/healthflow_test"
          TEST_OWNER_DATABASE_URL: "postgresql://ci:ci@localhost:5432/healthflow_test"
          RLS_ENFORCE: "on"
          RLS_TEST_UNSCOPED: "system"
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee /tmp/test.log || { sed 's/\x1b\[[0-9;]*m//g' /tmp/test.log | grep -E "Error|violates|permission denied|does not exist|expected" | grep -v "^ *at " | sort | uniq -c | sort -rn | head -40 | sed 's/^/::error::/'; sed 's/\x1b\[[0-9;]*m//g' /tmp/test.log | grep -A12 "KnownRequestError" | head -60 | sed 's/^/::error::/'; exit 1; }

  # Real browser, real Worker, real API and database. It catches what unit
  # tests cannot: a page that does not hydrate, a script blocked by the
  # security policy, a sign-in page that no longer works, an accessibility
  # regression on a public page.
  browser-tests:
    # Pinned: on the newer ubuntu-latest image, installing the browser's system packages fails.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: healthflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/healthflow_test"
      JWT_ACCESS_SECRET: "ci-access-secret-not-for-production-0123456789"
      JWT_REFRESH_PEPPER: "ci-refresh-pepper-not-for-production-0123456789"
      MFA_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      PROXY_SHARED_SECRET: "ci-proxy-secret"
      WEB_ORIGIN: "http://localhost:8787"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @healthflow/db migrate:deploy

      - name: Start the API
        run: |
          pnpm --filter @healthflow/api exec tsx src/server.ts > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4000/health && break; sleep 2; done
          curl -sf localhost:4000/health

      - name: Build the website for Cloudflare
        run: pnpm --filter @healthflow/web cf:build

      - name: Start the Worker
        working-directory: apps/web
        run: |
          npx wrangler dev --port 8787 --local --var API_ORIGIN:http://localhost:4000 --var PROXY_SHARED_SECRET:ci-proxy-secret > worker.log 2>&1 &
          for i in $(seq 1 40); do curl -sf localhost:8787/login > /dev/null && break; sleep 3; done
          curl -sf localhost:8787/login > /dev/null || { echo "--- worker.log ---"; tail -60 worker.log; curl -si localhost:8787/login | head -20; exit 1; }

      - name: Install the browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run the browser tests
        working-directory: apps/web
        run: npx playwright test

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            api.log
            apps/web/worker.log
          retention-days: 7
