name: Database export

# A weekly encrypted copy of the database, kept for 30 days as a private
# download on this workflow's run page. It is a second line of defence next to
# Neon's own point-in-time history, held somewhere that is not Neon.
#
# Needs two repository secrets (Settings, Secrets and variables, Actions):
#   BACKUP_DATABASE_URL  Neon's direct (not pooled) connection string. A read-only role is best.
#   BACKUP_PASSPHRASE    The password that encrypts the copy. Keep a copy of it outside GitHub too.
# Until both exist the run fails on purpose, so a missing backup is noticed.

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets exist
        env:
          URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$URL" ] || [ -z "$PASS" ]; then
            echo "::error::BACKUP_DATABASE_URL and BACKUP_PASSPHRASE are not both set, so no export was made."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Export, encrypt and check the copy lists
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: scripts/backup.sh export

      - uses: actions/upload-artifact@v4
        with:
          name: healthflow-database-export
          path: export/*.dump.gpg
          retention-days: 30
          if-no-files-found: error
