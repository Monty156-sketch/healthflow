name: Keep API awake

# Render's free web-service tier sleeps after 15 minutes with no traffic
# and takes ~30-60s to wake on the next request. This pings the health
# endpoint every 10 minutes so a real user never hits that cold start.
# Costs nothing — GitHub Actions cron jobs on a public/private repo under
# the free minutes quota are free for this volume of requests.
#
# Set RENDER_API_URL in this repo's Settings → Secrets and variables →
# Actions → Variables (not Secrets — it's just the public base URL,
# e.g. https://healthflow-api.onrender.com) once the Render service exists.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS "${{ vars.RENDER_API_URL }}/health" || echo "Ping failed (service may be mid-deploy) — not failing the job"
